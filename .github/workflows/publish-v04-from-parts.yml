name: Publish Bulent TV v0.4

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v04-from-parts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout download repository
        uses: actions/checkout@v4

      - name: Diagnose staged v0.4 parts
        run: |
          set -euo pipefail
          for f in .publish/v04/part*.b64; do
            echo "--- $f"
            wc -c "$f"
            sha256sum "$f"
          done

      - name: Rebuild verified v0.4 APK
        run: |
          set -euo pipefail
          cat .publish/v04/part00.b64 \
              .publish/v04/part01.b64 \
              .publish/v04/part02.b64 \
              .publish/v04/part03.b64 \
              .publish/v04/part04.b64 \
              .publish/v04/part05.b64 \
              .publish/v04/part06.b64 \
              .publish/v04/part07.b64 > /tmp/BulentTV-v0.4.apk.b64
          echo "Base64 chars: $(wc -c < /tmp/BulentTV-v0.4.apk.b64)"
          base64 --decode /tmp/BulentTV-v0.4.apk.b64 > BulentTV-0.4.apk
          echo "APK bytes: $(stat -c%s BulentTV-0.4.apk)"
          sha256sum BulentTV-0.4.apk
          test "$(stat -c%s BulentTV-0.4.apk)" -eq 65685
          echo 'c7c9f244c2fa26670601ee3d30b853e983ff50dfd45d56527a25cc62cdf9a812  BulentTV-0.4.apk' | sha256sum -c -
          cp BulentTV-0.4.apk BulentTV-latest.apk

      - name: Commit APKs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BulentTV-0.4.apk BulentTV-latest.apk
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Bulent TV v0.4'
          git push
