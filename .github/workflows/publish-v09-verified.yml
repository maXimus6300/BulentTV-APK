name: Publish verified Bulent TV v0.9

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v09-verified.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact verified source artifact
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/v09.zip 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-1e38-8210-ae7c-70346edf48d4/raw?se=2026-11-01T16%3A40%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=e3d23b15-e635-5687-8d14-cdd4a3071bf8&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T08%3A51%3A12Z&ske=2026-11-02T08%3A51%3A12Z&sks=b&skv=2026-02-06&sig=gZMJggPQQDd7Xr3s7fK%2BBQGWkKmjFkrcbxhMPd%2BHCYo%3D'
          mkdir -p /tmp/v09
          unzip -q /tmp/v09.zip -d /tmp/v09
          APK=$(find /tmp/v09 -name 'app-release.apk' -type f | head -n1)
          test -n "$APK"
          echo 'd0ba084d528c38530b7bb10ce1e684931d78717857b4b93b71f6fc55fe4d2f2b  '"$APK" | sha256sum -c -
          cp "$APK" BulentTV-0.9.apk
          cp "$APK" BulentTV-latest.apk
          echo 'd0ba084d528c38530b7bb10ce1e684931d78717857b4b93b71f6fc55fe4d2f2b  BulentTV-0.9.apk' > BulentTV-0.9.sha256
      - name: Commit exact verified APK
        run: |
          set -euo pipefail
          git config user.name 'Bulent TV Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add BulentTV-0.9.apk BulentTV-latest.apk BulentTV-0.9.sha256
          git commit -m 'Publish verified Bulent TV v0.9'
          git push origin HEAD:main
