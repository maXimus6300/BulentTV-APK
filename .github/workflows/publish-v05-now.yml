name: Guarded publish Bülent TV v0.5 now

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v05-now.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify staged v0.5
        run: |
          set -euo pipefail
          mapfile -t PARTS < <(find .publish/v05 -maxdepth 1 -type f -name 'r*.b64' | sort -V)
          echo "Found ${#PARTS[@]} v0.5 blocks"
          test "${#PARTS[@]}" -ge 2
          cat "${PARTS[@]}" > /tmp/v05.b64
          base64 --decode /tmp/v05.b64 > BulentTV-0.5.apk
          test -s BulentTV-0.5.apk
          unzip -t BulentTV-0.5.apk >/dev/null
          unzip -l BulentTV-0.5.apk | grep -q AndroidManifest.xml
          unzip -l BulentTV-0.5.apk | grep -Eq 'classes[0-9]*\.dex'
          sha256sum BulentTV-0.5.apk | tee BulentTV-0.5.sha256
          cp BulentTV-0.5.apk BulentTV-latest.apk
      - name: Publish only verified APK
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BulentTV-0.5.apk BulentTV-latest.apk BulentTV-0.5.sha256
          git diff --cached --quiet && exit 0
          git commit -m 'Publish verified Bülent TV v0.5'
          git push
