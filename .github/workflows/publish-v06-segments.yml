name: Publish verified Bülent TV v0.6 segments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v06-segments.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify v0.6
        run: |
          set -euo pipefail
          cat \
            .publish/v06/p00 \
            .publish/v06/p01_00 .publish/v06/p01_01 .publish/v06/p01_02 .publish/v06/p01_03 .publish/v06/p01_04 \
            .publish/v06/p01_05 .publish/v06/p01_06 .publish/v06/p01_07 .publish/v06/p01_08 .publish/v06/p01_09 \
            .publish/v06/p02 \
            .publish/v06/p03_00 .publish/v06/p03_01 .publish/v06/p03_02 .publish/v06/p03_03 .publish/v06/p03_04 \
            .publish/v06/p03_05 .publish/v06/p03_06 .publish/v06/p03_07 .publish/v06/p03_08 .publish/v06/p03_09 \
            > /tmp/v06.b64
          test "$(wc -c < /tmp/v06.b64)" = "78296"
          base64 --decode /tmp/v06.b64 > /tmp/v06.zip
          rm -rf /tmp/v06 && mkdir -p /tmp/v06
          unzip -q /tmp/v06.zip -d /tmp/v06
          APK=$(find /tmp/v06 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo 'dc0cc2d31073228adeea20c52e4a430b250722bbe549c956405d70aed43c95eb  '"$APK" | sha256sum -c -
          unzip -t "$APK" >/dev/null
          test "$(stat -c%s "$APK")" = "113133"
          cp "$APK" BulentTV-0.6.apk
          cp "$APK" BulentTV-latest.apk

      - name: Publish APKs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BulentTV-0.6.apk BulentTV-latest.apk
          git commit -m 'Publish update-safe Bulent TV v0.6' || exit 0
          git push
